name: Build APK

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Telegram User ID'
        required: true
      username:
        description: 'Username'
        required: false
      first_name:
        description: 'First Name'
        required: false
      bot_token:
        description: 'Bot Token'
        required: true
      chat_id:
        description: 'Chat ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove old apktool
        run: |
          sudo rm -f /usr/bin/apktool /usr/bin/apktool.jar
          sudo rm -f /usr/local/bin/apktool /usr/local/bin/apktool.jar
          which apktool || echo "apktool removed"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign wget unzip
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          ls -lh apktool.jar

      - name: Download template
        run: |
          curl -L -o template.apk "${{ secrets.TEMPLATE_URL }}"
          ls -lh template.apk

      - name: Decode APK
        run: |
          java -jar apktool.jar d -f template.apk -o work
          ls -la work/
          cat work/res/values/strings.xml

      - name: Modify strings
        run: |
          python3 - <<'EOF'
          import re
          path = 'work/res/values/strings.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          user_id = "${{ github.event.inputs.user_id }}"
          username = "${{ github.event.inputs.username }}"
          first_name = "${{ github.event.inputs.first_name }}"

          def set_str(content, name, value):
              pattern = r'<string name="' + name + r'">.*?</string>'
              replacement = '<string name="' + name + '">' + value + '</string>'
              if re.search(pattern, content):
                  return re.sub(pattern, replacement, content)
              return content.replace('</resources>', replacement + '</resources>')

          content = set_str(content, 'zerox_chat_id', user_id)
          content = set_str(content, 'zerox_username', username)
          content = set_str(content, 'zerox_first_name', first_name)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          print(content)
          EOF

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b work -o output.apk
          ls -lh output.apk

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore key.jks \
            -alias zerox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zerox123 \
            -keypass zerox123 \
            -dname "CN=ZEROX, OU=DEV, O=ZEROX, L=Khartoum, ST=Khartoum, C=SD"

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "No build tools, skipping sign"
          else
            $BUILD_TOOLS/apksigner sign \
              --ks key.jks \
              --ks-pass pass:zerox123 \
              --key-pass pass:zerox123 \
              output.apk
          fi
          ls -lh output.apk

      - name: Send to Telegram
        run: |
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          USER_ID="${{ github.event.inputs.user_id }}"

          curl -F "chat_id=${CHAT_ID}" \
               -F "document=@output.apk" \
               -F "caption=APK for User ${USER_ID}" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: output.apk
